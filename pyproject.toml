[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nwm-rl"
version = "2.4.0"
description = "Negative Weight Mapping - a non-parametric reinforcement learning framework using persistent potential fields"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "CastermustOfficial" }]
maintainers = [{ name = "CastermustOfficial" }]
keywords = [
    "reinforcement-learning",
    "machine-learning",
    "ai",
    "potential-field",
    "exploration",
    "non-parametric",
    "instance-based",
    "gymnasium",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.20.0",
    "gymnasium>=0.26.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.5.0"]
baselines = ["torch>=2.0.0"]
benchmark = ["matplotlib>=3.5.0", "torch>=2.0.0", "pandas>=1.5.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
    "mypy>=1.8.0",
    "pre-commit>=3.5.0",
]
full = ["matplotlib>=3.5.0", "torch>=2.0.0", "pandas>=1.5.0"]

[project.urls]
Homepage = "https://github.com/CastermustOfficial/NWM"
Repository = "https://github.com/CastermustOfficial/NWM"
Documentation = "https://github.com/CastermustOfficial/NWM#readme"
Issues = "https://github.com/CastermustOfficial/NWM/issues"
Changelog = "https://github.com/CastermustOfficial/NWM/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nwm*"]

[tool.setuptools.package-data]
nwm = ["py.typed"]

# ---------------------------------------------------------------------------
# Testing & coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: end-to-end tests that train against a Gymnasium environment",
]

[tool.coverage.run]
branch = true
source = ["nwm"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# ---------------------------------------------------------------------------
# Ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests", "benchmarks", "examples"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "NPY", # numpy-specific rules
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# Tests exercise the legacy global RNG on purpose (NPY002) and favor
# readability over bugbear/simplify rewrites.
"tests/*" = ["B", "SIM", "NPY002"]
"examples/*" = ["B", "SIM"]
"benchmarks/*" = ["B"]

[tool.ruff.lint.isort]
known-first-party = ["nwm"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
files = ["src/nwm"]
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["gymnasium.*", "matplotlib.*", "torch.*", "pandas.*"]
ignore_missing_imports = true
