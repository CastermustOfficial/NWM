name: Paper

# Compiles the LaTeX paper to a PDF and uploads it as a build artifact, so the
# manuscript is verified to build on every change to paper/.

on:
  push:
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"
  pull_request:
    paths:
      - "paper/**"
  workflow_dispatch:

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: nwm.tex
          working_directory: paper
          latexmk_use_xelatex: false
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: nwm-paper
          path: paper/nwm.pdf
